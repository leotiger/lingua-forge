name: Deploy to WordPress.org

# Disabled: WordPress.org rejected the plugin name ("Lingua Forge").
# Distribution is via self-hosted update channel (docs/lf-update-manifest.php).
# Re-enable by restoring the push/tags trigger if WP.org submission is ever approved.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: lingua-forge
          ASSETS_DIR: docs/assets

